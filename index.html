<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕的单车之旅</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
}

canvas {
  display: block;
  cursor: pointer;
}

.info {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #2C5F7F;
  font-size: 14px;
  background: rgba(255, 255, 255, 0.85);
  padding: 12px 18px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  user-select: none;
}

.info h1 {
  font-size: 18px;
  margin-bottom: 6px;
  font-weight: 600;
}

.info p {
  font-size: 13px;
  line-height: 1.6;
  opacity: 0.85;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="info">
  <h1>🚴 鹈鹕的单车之旅</h1>
  <p>点击画布切换场景</p>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// === 场景系统 ===
const SCENES = ['morning', 'noon', 'sunset'];
let currentScene = 0;

const sceneConfig = {
  morning: {
    skyTop: '#FFB6C1',
    skyBottom: '#FFE5D9',
    groundColor: '#A8D8A0',
    cloudColor: 'rgba(255, 192, 203, 0.6)',
    sunColor: '#FFA07A',
    sunY: 0.25
  },
  noon: {
    skyTop: '#87CEEB',
    skyBottom: '#B0E0E6',
    groundColor: '#90C990',
    cloudColor: 'rgba(255, 255, 255, 0.8)',
    sunColor: '#FFD700',
    sunY: 0.15
  },
  sunset: {
    skyTop: '#FF6B6B',
    skyBottom: '#FFD93D',
    groundColor: '#8FA887',
    cloudColor: 'rgba(255, 140, 105, 0.7)',
    sunColor: '#FF4500',
    sunY: 0.7
  }
};

// === 动画时间 ===
let t = 0;

// === 鹈鹕骑行参数 ===
const bike = {
  x: 0.3,
  y: 0.6,
  wheelRadius: 30,
  pedalRadius: 12,
  crankLength: 45,
  speed: 0.03
};

// === 云朵数据 ===
const clouds = [];
for (let i = 0; i < 8; i++) {
  clouds.push({
    x: Math.random(),
    y: 0.15 + Math.random() * 0.25,
    scale: 0.5 + Math.random() * 0.8,
    speed: 0.0002 + Math.random() * 0.0003
  });
}

// === 树木数据 ===
const trees = [];
for (let i = 0; i < 12; i++) {
  trees.push({
    x: Math.random(),
    height: 60 + Math.random() * 80,
    width: 40 + Math.random() * 40,
    speed: 0.0008
  });
}

// === 绘制云朵 ===
function drawCloud(x, y, scale, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 25 * scale, 0, Math.PI * 2);
  ctx.arc(x + 30 * scale, y, 30 * scale, 0, Math.PI * 2);
  ctx.arc(x + 60 * scale, y, 25 * scale, 0, Math.PI * 2);
  ctx.arc(x + 30 * scale, y - 15 * scale, 20 * scale, 0, Math.PI * 2);
  ctx.fill();
}

// === 绘制树 ===
function drawTree(x, y, width, height) {
  // 树干
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(x - width * 0.15, y - height, width * 0.3, height);
  
  // 树冠
  ctx.fillStyle = '#2D5016';
  ctx.beginPath();
  ctx.ellipse(x, y - height * 0.7, width * 0.6, height * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#3A6B1F';
  ctx.beginPath();
  ctx.ellipse(x, y - height * 0.85, width * 0.5, height * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
}

// === 绘制太阳/月亮 ===
function drawSun(x, y, radius, color) {
  const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
  grad.addColorStop(0, color);
  grad.addColorStop(1, color + '88');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

// === 绘制自行车 ===
function drawBike(x, y, wheelAngle) {
  const wr = bike.wheelRadius;
  
  // 后轮
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x - 60, y, wr, 0, Math.PI * 2);
  ctx.stroke();
  
  // 辐条
  for (let i = 0; i < 8; i++) {
    const a = wheelAngle + (i * Math.PI / 4);
    ctx.beginPath();
    ctx.moveTo(x - 60, y);
    ctx.lineTo(x - 60 + Math.cos(a) * wr, y + Math.sin(a) * wr);
    ctx.stroke();
  }
  
  // 前轮
  ctx.beginPath();
  ctx.arc(x + 60, y, wr, 0, Math.PI * 2);
  ctx.stroke();
  
  for (let i = 0; i < 8; i++) {
    const a = wheelAngle + (i * Math.PI / 4);
    ctx.beginPath();
    ctx.moveTo(x + 60, y);
    ctx.lineTo(x + 60 + Math.cos(a) * wr, y + Math.sin(a) * wr);
    ctx.stroke();
  }
  
  // 车架
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#D32F2F';
  ctx.beginPath();
  ctx.moveTo(x - 60, y);
  ctx.lineTo(x - 10, y - 40);
  ctx.lineTo(x + 20, y - 40);
  ctx.lineTo(x + 60, y);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(x - 10, y - 40);
  ctx.lineTo(x - 10, y - 10);
  ctx.stroke();
  
  // 座位
  ctx.fillStyle = '#222';
  ctx.fillRect(x + 15, y - 45, 30, 8);
  
  // 车把
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + 60, y - 10);
  ctx.lineTo(x + 60, y - 35);
  ctx.lineTo(x + 75, y - 30);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(x + 60, y - 35);
  ctx.lineTo(x + 45, y - 30);
  ctx.stroke();
}

// === 绘制鹈鹕 ===
function drawPelican(x, y, legAngle, wingAngle) {
  // 腿部 - 两段IK
  const hipY = y - 35;
  const pedalAngle = legAngle;
  const pedalX = x - 10 + Math.cos(pedalAngle) * bike.crankLength;
  const pedalY = y - 10 + Math.sin(pedalAngle) * bike.crankLength;
  
  // 大腿
  const thighLen = 35;
  const calfLen = 35;
  const dx = pedalX - x;
  const dy = pedalY - hipY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const clampDist = Math.min(dist, thighLen + calfLen - 5);
  
  const angle = Math.atan2(dy, dx);
  const cosAngle = (thighLen * thighLen + clampDist * clampDist - calfLen * calfLen) / (2 * thighLen * clampDist);
  const kneeAngle = angle + Math.acos(Math.max(-1, Math.min(1, cosAngle)));
  
  const kneeX = x + Math.cos(kneeAngle) * thighLen;
  const kneeY = hipY + Math.sin(kneeAngle) * thighLen;
  
  ctx.strokeStyle = '#FFB347';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x, hipY);
  ctx.lineTo(kneeX, kneeY);
  ctx.lineTo(pedalX, pedalY);
  ctx.stroke();
  
  // 脚
  ctx.fillStyle = '#FFB347';
  ctx.beginPath();
  ctx.arc(pedalX, pedalY, 5, 0, Math.PI * 2);
  ctx.fill();
  
  // 身体
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.ellipse(x + 15, y - 50, 35, 45, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.strokeStyle = '#DDD';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // 翅膀
  const wingY = y - 55 + Math.sin(wingAngle) * 5;
  ctx.fillStyle = '#F5F5F5';
  ctx.beginPath();
  ctx.ellipse(x - 5, wingY, 25, 15, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#CCC';
  ctx.stroke();
  
  // 头部
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(x + 40, y - 70, 20, 0, Math.PI * 2);
  ctx.fill();
  
  // 嘴囊
  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.moveTo(x + 55, y - 65);
  ctx.quadraticCurveTo(x + 70, y - 60, x + 75, y - 55);
  ctx.lineTo(x + 70, y - 50);
  ctx.quadraticCurveTo(x + 65, y - 55, x + 55, y - 60);
  ctx.fill();
  
  // 嘴
  ctx.fillStyle = '#FF8C00';
  ctx.beginPath();
  ctx.moveTo(x + 55, y - 70);
  ctx.lineTo(x + 80, y - 68);
  ctx.lineTo(x + 80, y - 65);
  ctx.lineTo(x + 55, y - 67);
  ctx.fill();
  
  // 眼睛
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x + 45, y - 73, 3, 0, Math.PI * 2);
  ctx.fill();
  
  // 尾巴
  ctx.fillStyle = '#E0E0E0';
  ctx.beginPath();
  ctx.moveTo(x - 15, y - 40);
  ctx.lineTo(x - 35, y - 45);
  ctx.lineTo(x - 30, y - 35);
  ctx.fill();
}

// === 绘制草地细节 ===
function drawGrass(groundY, offset) {
  ctx.strokeStyle = '#6B8E23';
  ctx.lineWidth = 2;
  for (let i = 0; i < 50; i++) {
    const gx = ((i * 50 + offset * 500) % W);
    const gh = 10 + Math.sin(i * 0.5 + t * 0.01) * 5;
    ctx.beginPath();
    ctx.moveTo(gx, groundY);
    ctx.lineTo(gx, groundY - gh);
    ctx.stroke();
  }
}

// === 主渲染 ===
function render() {
  const scene = sceneConfig[SCENES[currentScene]];
  
  // 天空渐变
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, scene.skyTop);
  skyGrad.addColorStop(1, scene.skyBottom);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  
  // 太阳
  drawSun(W * 0.8, H * scene.sunY, 50, scene.sunColor);
  
  // 云朵层
  clouds.forEach(cloud => {
    cloud.x = (cloud.x + cloud.speed) % 1.3 - 0.15;
    drawCloud(cloud.x * W, cloud.y * H, cloud.scale, scene.cloudColor);
  });
  
  // 地面
  const groundY = H * 0.65;
  ctx.fillStyle = scene.groundColor;
  ctx.fillRect(0, groundY, W, H - groundY);
  
  // 树木层
  trees.forEach(tree => {
    tree.x = (tree.x + tree.speed) % 1.2 - 0.1;
    if (tree.x > -0.1 && tree.x < 1.1) {
      drawTree(tree.x * W, groundY, tree.width, tree.height);
    }
  });
  
  // 草地
  drawGrass(groundY, t * bike.speed);
  
  // 地平线
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
  
  // 鹈鹕和自行车
  const px = W * bike.x;
  const py = H * bike.y;
  const wheelAngle = -t * bike.speed * 5;
  const legAngle = wheelAngle;
  const wingAngle = t * 0.05;
  
  drawBike(px, py, wheelAngle);
  drawPelican(px, py, legAngle, wingAngle);
  
  t++;
  requestAnimationFrame(render);
}

// === 场景切换 ===
canvas.addEventListener('click', () => {
  currentScene = (currentScene + 1) % SCENES.length;
});

render();
</script>
</body>
</html>
